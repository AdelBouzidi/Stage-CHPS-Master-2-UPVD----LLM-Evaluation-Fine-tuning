base_model: /path/to/calypso/workdir/models/Qwen3.5-9B


strict: false

chat_template: qwen3_5

datasets:
  - path: /path/to/calypso/workdir/finetuning_domaines_eval/data/train_A_chat.jsonl
    type: chat_template

dataset_prepared_path: /path/to/calypso/workdir/finetuning_domaines_eval/prepared/train_A

val_set_size: 0.1

output_dir: /path/to/calypso/workdir/finetuning_domaines_eval/outputs/train_A

sequence_len: 4096

sample_packing: false

load_in_4bit: false
adapter: lora

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - down_proj
  - up_proj

optimizer: adamw_bnb_8bit

micro_batch_size: 1
gradient_accumulation_steps: 8

num_epochs: 2

learning_rate: 1e-4
lr_scheduler: cosine

bf16: true
tf32: true

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

attn_implementation: eager

logging_steps: 1

warmup_ratio: 0.03

saves_per_epoch: 1

weight_decay: 0.0

lora_qkv_kernel: false
lora_o_kernel: false
lora_mlp_kernel: false
lora_embedding_kernel: false

evals_per_epoch: 2
logging_steps: 1
